    <!-- 1. Environment & Resilience Shim -->
    <script>
      (function() {
        window.process = { env: { NODE_ENV: 'production', API_KEY: '' } };
        window.global = window;
        
        // DEV TEST FIX: Aggressive cleanup of bad data
        try {
          Object.keys(localStorage).forEach(function(key) {
            var val = localStorage.getItem(key);
            if (val === "undefined" || val === "null" || val === "[object Object]" || val === "" || val === "{}") {
              localStorage.removeItem(key);
            }
          });
        } catch(e) {}

        window.onerror = function(msg, url, line, col, error) {
          console.error("App Runtime Error:", msg);
          var root = document.getElementById('root');
          if (root && root.innerHTML === '') {
            root.innerHTML = '<div style="padding:40px; font-family:sans-serif; text-align:center; color:#16a34a;">' +
              '<h3 style="margin-bottom:10px;">সিস্টেম রিলোড হচ্ছে...</h3>' +
              '<p style="color:#666; font-size:14px; margin-bottom:20px;">ব্রাউজারে ত্রুটিপূর্ণ ডাটা পাওয়া গেছে।</p>' +
              '<button onclick="localStorage.clear(); window.location.reload();" style="padding:12px 24px; background:#16a34a; color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer; box-shadow:0 4px 12px rgba(22,163,74,0.2);">ডাটা ক্লিয়ার করে অ্যাপ চালু করুন</button>' +
              '</div>';
          }
          return false;
        };

        // Failsafe for stuck loading screen
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.innerHTML === '') {
             console.warn("App taking too long to load, showing manual recovery.");
             var recovery = document.createElement('div');
             recovery.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:9999;";
             recovery.innerHTML = '<button onclick="window.location.reload(true)" style="padding:10px 20px; background:#f97316; color:white; border:none; border-radius:30px; font-weight:bold; cursor:pointer; font-size:12px; opacity:0.8;">পুনরায় লোড করুন (Force Reload)</button>';
             document.body.appendChild(recovery);
          }
        }, 8000);
      })();
    </script>
