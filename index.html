
<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Digital Desh BD - বাংলাদেশের সেরা ডিজিটাল সেবা পোর্টাল | কৃষি, স্বাস্থ্য ও শিক্ষা</title>
    
    <!-- 1. Environment & Resilience Shim -->
    <script>
      (function() {
        window.process = { env: { NODE_ENV: 'production', API_KEY: '' } };
        window.global = window;
        
        // DEV TEST FIX: Clear bad 'undefined' entries from storage
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            var value = localStorage.getItem(key);
            if (value === "undefined" || value === "null" || value === "[object Object]") {
              localStorage.removeItem(key);
            }
          }
        } catch(e) {}

        window.onerror = function(msg, url, line, col, error) {
          console.error("App Runtime Error:", msg);
          var root = document.getElementById('root');
          if (root && root.innerHTML === '') {
            root.innerHTML = '<div style="padding:20px; font-family:sans-serif; text-align:center; color:#16a34a;">' +
              '<h3>সিস্টেম রিলোড হচ্ছে...</h3>' +
              '<button onclick="localStorage.clear(); window.location.reload();" style="margin-top:10px; padding:10px 20px; background:#16a34a; color:white; border:none; border-radius:8px;">ক্লিয়ার করে স্টার্ট করুন</button>' +
              '</div>';
          }
          return false;
        };
      })();
    </script>

    <!-- 2. ES Module Shims -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/": "https://esm.sh/react@18.3.1/",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/": "https://esm.sh/react-dom@18.3.1/",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "@google/genai": "https://esm.sh/@google/genai@1.33.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
        "vite": "https://esm.sh/vite@^7.3.1",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
        "next/": "https://esm.sh/next@^16.1.1/",
        "next": "https://esm.sh/next@^16.1.1"
      }
    }
    </script>

    <!-- UI Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d' }
            },
            fontFamily: { sans: ['"Noto Sans Bengali"', '"Hind Siliguri"', 'sans-serif'] }
          }
        }
      }
    </script>
    
    <style>
      body { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; overflow-x: hidden; background-color: #ffffff; }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #16a34a; border-radius: 10px; }
      img { -webkit-user-drag: none; pointer-events: none; }
      #root:empty::after { content: "ডিজিটাল দেশ লোড হচ্ছে..."; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #16a34a; font-weight: bold; font-family: sans-serif; animation: pulse 2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx" crossorigin></script>
  </body>
</html>
